# nginx site template. remote-install.sh fills in __DOMAIN__ and __PORT__ from
# the server's tether.env and installs it once as a plain-HTTP block; certbot
# --nginx then rewrites it in place to add TLS and the HTTP->HTTPS redirect.
# After that, remote-install.sh only keeps the proxy_pass port in sync.

server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MCP (phase 4) streams responses; don't buffer them.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
